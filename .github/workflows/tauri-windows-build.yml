# PINNED ACTION VERSIONS — DO NOT DOWNGRADE (C-CI-5): Node 24 majors only
# (checkout@v5, setup-python@v7, cache@v5, setup-node@v7, upload-artifact@v6,
# attest-build-provenance@v4, setup-uv@v7, rust-toolchain@v1). See build.yml.
# PINNED NUITKA VERSION — DO NOT DOWNGRADE (NU-105 / C-CI-6): nuitka==2.8.10
# in BOTH install steps. Nuitka <2.8 crashes numpy>=2.5 PEP 695 (#3469/#3392/#3561);
# bump Nuitka forward, never downgrade numpy. See docs/code-notes/ci-workflows.md
# Tauri Windows Build (Phase 0-W / 1-W): Nuitka sidecar + cargo tauri build.
# Trigger: manual workflow_dispatch ONLY until Phase 0-W host validation
# (C-CI-4: do not uncomment push/PR). Runbook:
# docs/migration/windows-validation-runbook.md. See docs/code-notes/ci-workflows.md

name: Build Windows

# GATE STATUS — VALIDATE ON WINDOWS HOST (aarch64 / TX-40 / C-CI-4)
# aarch64 matrix stays a COMMENTED template (no public windows-11-arm runner;
# matrix unavailable in jobs.<id>.if). x86_64 ships. See docs/code-notes/ci-workflows.md

on:
  workflow_call:
    inputs:
      target:
        description: "Rust target triple (empty = host triple)"
        required: false
        default: ""
        type: string
      sign:
        description: "Code-sign + notarize the bundle (requires secrets)"
        required: false
        default: false
        type: boolean
      # PYBS pin is a workflow_call/dispatch input (per-dispatch bump, no file edit).
      pybs_date:
        description: "python-build-standalone release date (YYYYMMDD)"
        required: false
        default: "20241219"
        type: string
      pybs_version:
        description: "CPython version (e.g. 3.12.8)"
        required: false
        default: "3.12.8"
        type: string
  workflow_dispatch:
    inputs:
      pybs_date:
        description: "python-build-standalone release date (YYYYMMDD)"
        required: false
        default: "20241219"
      pybs_version:
        description: "CPython version (e.g. 3.12.8)"
        required: false
        default: "3.12.8"
      # sign flag also on direct dispatch (orchestrator passes it via workflow_call).
      sign:
        description: "Code-sign + notarize the bundle (requires secrets)"
        required: false
        default: false
        type: boolean
  # Do NOT enable push/PR triggers until Phase 0-W passes on a real host.

# CI-08-style concurrency: cancel in-flight PR builds, keep release
concurrency:
  group: tauri-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# WR-17: top-level least-privilege default. Mirrors the macOS / Linux
# and the repo-wide CI-08 / XS-28 pinning policy. The job-level block at
permissions:
  contents: read

env:
  # S5-CR-74: PYBS pin now sourced from BOTH the workflow_call `inputs`
  # TX-40: PYBS_TRIPLE + RUST_TARGET used to live here as x86_64-pc-windows-msvc
  PYBS_DATE: ${{ inputs.pybs_date || github.event.inputs.pybs_date || '20241219' }}
  PYBS_VERSION: ${{ inputs.pybs_version || github.event.inputs.pybs_version || '3.12.8' }}

jobs:
  build-sidecar-exe:
    # JOB SPLIT (2026-09-29): the sidecar Nuitka freeze gets its own job so
    # it holds a full 240min budget in parallel with the worker freeze.
    # Previously sidecar + worker + Tauri shared one job and hit the 240min
    # ceiling mid-worker-build. This job needs nothing from other jobs; the
    # tauri-windows-build job downloads its binary via artifacts.
    # Matrix mirrors tauri-windows-build (x86_64 active, aarch64 commented
    # template per C-CI-4); keep all job matrices in lockstep. If enabling
    # aarch64, arch-suffix the intermediate artifact name below (TX-40).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-2022
            tauri_config: tauri.windows-x86_64.conf.json
          # - arch: aarch64
          #   target: aarch64-pc-windows-msvc
          #   runner: windows-11-arm
          #   tauri_config: tauri.windows-aarch64.conf.json
    # No job-level if: — matrix.* is illegal in jobs.<id>.if (C-CI-4 / TX-40).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      # TX-40: target triple from matrix (x86_64 or aarch64 template); job-level env.
      PYBS_TRIPLE: ${{ matrix.target }}
      # NUITKA_CACHE_DIR pins Nuitka's cache base (clcache object files +
      # dependency-walker downloads) so the cache step below has a stable path
      # to persist. MUST be job-level: C-CI-12's lesson is that step-level env
      # does NOT reach the Nuitka/SCons C-compiler subprocess, so a step-level
      # value would silently leave Nuitka on its appdirs default and the cached
      # directory would stay empty.
      NUITKA_CACHE_DIR: C:\Users\runner\AppData\Local\nuitka
      # Caching is INTENTIONALLY on in this job (no CLCACHE_DISABLE):
      # Nuitka wraps cl with its inline clcache copy and stores objects
      # under its own cache dir, which the ccache step above persists
      # across runs, so repeat builds skip unchanged TUs. The old torch
      # C-compile hang that motivated the disable is gone with torch
      # nofollowed out of every freeze (NU-106 / C-CI-8).

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Nuitka clcache: persist MSVC object files between builds. This is the
      # step that makes a repeat freeze minutes instead of ~3 h. The previous
      # `nuitka\cache` path matched no real Nuitka directory, so this step
      # reported "Cache Not Found" on every run and NO cache was ever written
      # (verified: zero `tauri-windows-nuitka-*` entries existed on the repo).
      # The key is per-``matrix.target`` because both freeze jobs run in
      # parallel; sharing one key made them race to write the same entry.
      - name: Cache Nuitka build artifacts (clcache objects)
        uses: actions/cache@v5
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: tauri-windows-nuitka-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('pyproject.toml', 'requirements-lock.txt') }}
          restore-keys: |
            tauri-windows-nuitka-${{ runner.os }}-${{ matrix.target }}-

      # Scons build dir: when it survives between runs, scons skips
      # up-to-date objects (checksum-based) instead of recompiling ~800
      # TUs from scratch. Keyed on deps so a dependency bump rebuilds.
      - name: Cache Nuitka scons build dir (incremental C builds)
        uses: actions/cache@v5
        with:
          path: src-tauri/bin/*.build
          key: tauri-windows-scons-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('pyproject.toml', 'requirements-lock.txt') }}
          restore-keys: |
            tauri-windows-scons-${{ runner.os }}-${{ matrix.target }}-

      - name: Download + verify python-build-standalone
        shell: pwsh
        run: |
          $date = $env:PYBS_DATE
          $pyver = $env:PYBS_VERSION
          $triple = $env:PYBS_TRIPLE
          $archive = "cpython-$pyver+$date-$triple-install_only.tar.gz"
          $url = "https://github.com/astral-sh/python-build-standalone/releases/download/$date/$archive"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $archive
          # The python-build-standalone releases do NOT have a SHA256SUMS.txt aggregate.
          $shaUrl = "https://github.com/astral-sh/python-build-standalone/releases/download/$date/$archive.sha256"
          Write-Host "Downloading checksum: $shaUrl"
          Invoke-WebRequest -Uri $shaUrl -OutFile "$archive.sha256"
          # The .sha256 file contains: "<sha256>  <filename>"
          $expected = (Get-Content "$archive.sha256" -Raw).Split(' ', 2)[0].Trim().ToLower()
          $actual = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLower()
          if ($expected -ne $actual) {
            Write-Error "SHA-256 mismatch for $archive`nexpected=$expected`nactual=$actual"
            exit 1
          }
          Write-Host "SHA-256 OK: $actual"
          # Extract to C:\tools\pybs\python (matches runbook §0.7)
          New-Item -ItemType Directory -Force -Path C:\tools\pybs | Out-Null
          tar -xzf $archive -C C:\tools\pybs
          Write-Host "PYBS python:"
          C:\tools\pybs\python\python.exe --version
          # Add PYBS to GITHUB_ENV so subsequent steps can use it.
          echo "PYBS=C:\tools\pybs\python\python.exe" >> $env:GITHUB_ENV
          # Install the project + Nuitka into the PYBS env (the env that
          C:\tools\pybs\python\python.exe -m pip install --upgrade --no-warn-script-location pip
          C:\tools\pybs\python\python.exe -m pip install --no-warn-script-location nuitka==2.8.10 zstandard ordered-set
          C:\tools\pybs\python\python.exe -m pip install --no-warn-script-location -e ".[dev,test]"
          C:\tools\pybs\python\python.exe -c "import faster_whisper, ctranslate2; print('ctranslate2', ctranslate2.__version__)"

      - name: Build the sidecar with Nuitka (ADR-0020 §4.2)
        shell: pwsh
        run: |
          # PYBS arrives as the full exe path (setup step exports
          # C:\tools\pybs\python\python.exe). Accept a directory too.
          $PYBS = $env:PYBS
          if ($PYBS -notmatch 'python\.exe$') { $PYBS = "$PYBS\python.exe" }
          $SITE = & $PYBS -c "import site; print(site.getsitepackages()[-1])"
          Write-Host "PYBS=$PYBS  SITE=$SITE"
          # Nuitka optimizer crashes on av's Cython .py shims
          # (assert micro_passes == 0, upstream issue 3970); each has a
          # .pyd twin Python prefers, so the helper deletes only those.
          & $PYBS scripts/build/strip_av_cython_shims.py
          if ($LASTEXITCODE -ne 0) { Write-Error "av shim strip failed"; exit 1 }
          # ADR-0025 C7: ASR lives in the pack worker — the ctranslate2
          # DLL/data-dir plumbing below was deleted in the same change
          # (mirrors scripts/build/build_sidecar_windows.sh); the WORKER
          # build owns those flags now.
          $dataDirFlag = @()
          # S4-CR-25 / nu-opt-1: psutil imports ALL platform submodules
          # NU-106 / C-CI-8: torch removed runtime-wide (VAD on ONNX). Never re-add
          # --nofollow-import-to for torch.utils.data.distributed / torch.export /
          # torch._functorch / torch.testing / torch.package if torch returns
          # (those leave a broken half-compiled torch behind). The top-level
          # --nofollow-import-to=torch below is different and safe: our code
          # never imports torch (only onnxruntime/transformers/machine_info.py
          # has a guarded probe import nobody calls), and compiling torch 2.13
          # crashes the Nuitka optimizer (torch._dynamo.pgo).
          # IPD-1 / C-CI-9: keep --include-package-data=voice_typer.server,
          # --windows-console-mode=disable, --onefile-tempdir-spec (missing package
          # data = launch FileNotFoundError that builds fine in CI).
          # TX-40: output filename carries matrix.target so aarch64 does not overwrite
          # x86_64 (python-sidecar-aarch64-pc-windows-msvc.exe).
          # ADR-0023 packaging: media ingest lazily imports yt_dlp /
          # yt_dlp_ejs / av (decoder.py, downloader.py, subtitles.py,
          # mini_update.py); static follow-imports alone misses nothing
          # but the package-data flag guarantees yt-dlp's non-code
          # assets ride along. av wheels bundle FFmpeg DLLs.
          # NOTE: keep this comment ABOVE the invocation, never between the
          # backtick-continued flag lines below: pwsh cannot continue a
          # statement through `#` comment lines (ParserError "Missing
          # expression after unary operator").
          # yt-dlp extractors (~940 modules + the 781KB lazy_extractors hub)
          # ship as bytecode: compiling them OOMs MSVC (C1060/C1002) and
          # bloats the binary; yt-dlp lazy-loads them via importlib at
          # runtime, which resolves bytecode modules fine (Nuitka anti-bloat
          # "bytecode" mode, same mechanism as its eventlet/matplotlib rules).
          & $PYBS -m nuitka `
              --standalone --onefile `
              --assume-yes-for-downloads `
              --show-progress `
              --jobs=3 `
              --noinclude-custom-mode=yt_dlp.extractor:bytecode `
              --nofollow-import-to=transformers `
              --nofollow-import-to=scipy._lib.cobyqa `
              --nofollow-import-to=scipy._lib.array_api_extra.testing `
              --nofollow-import-to=scipy.spatial.transform `
              --nofollow-import-to=scipy.ndimage `
              --nofollow-import-to=scipy.sparse.linalg `
              --nofollow-import-to=sympy `
              --nofollow-import-to=mpmath `
              --nofollow-import-to=pytest `
              --nofollow-import-to=PIL.ImageQt `
              --nofollow-import-to=PIL.ImageTk `
              --nofollow-import-to=PIL.ImageCms `
              --nofollow-import-to=numpy.distutils `
              --nofollow-import-to=numpy.f2py `
              --nofollow-import-to=numpy.testing `
              --nofollow-import-to=psutil._pslinux `
              --nofollow-import-to=psutil._psosx `
              --nofollow-import-to=psutil._psbsd `
              --nofollow-import-to=psutil._pssunos `
              --nofollow-import-to=psutil._psaix `
              --nofollow-import-to=faster_whisper `
              --nofollow-import-to=ctranslate2 `
              --nofollow-import-to=torch `
              --include-package=voice_typer `
              --include-package=websockets `
              --include-package=yt_dlp `
              --include-package=yt_dlp_ejs `
              --include-package=av `
              --include-package-data=yt_dlp `
              --include-package-data=voice_typer.server `
              $($dataDirFlag) `
              --windows-console-mode=disable `
              --onefile-tempdir-spec="{CACHE_DIR}/lausu/onefile-tmp" `
              --output-filename=python-sidecar-${{ matrix.target }}.exe `
              --output-dir=src-tauri\bin `
              voice_typer\server\ipc_server.py
          # Verify the binary exists + emits server_started
          if (-not (Test-Path "src-tauri\bin\python-sidecar-${{ matrix.target }}.exe")) {
            Write-Error "Sidecar binary not built"; exit 1
          }
          $size = (Get-Item "src-tauri\bin\python-sidecar-${{ matrix.target }}.exe").Length / 1MB
          Write-Host "Sidecar binary size: $([math]::Round($size,1)) MB"

      # Do NOT weaken the threshold to make an oversized bundle pass —
      - name: Assert sidecar size <= 185 MB (plan §11.4, Phase 1c target)
        shell: pwsh
        run: |
          $bin = "src-tauri\bin\python-sidecar-${{ matrix.target }}.exe"
          if (-not (Test-Path $bin)) {
            Write-Error "Sidecar binary not found at $bin — cannot enforce size gate."; exit 1
          }
          $size = (Get-Item $bin).Length / 1MB
          Write-Host "Sidecar size: $([math]::Round($size,2)) MB (limit: 185 MB)"
          if ($size -gt 185) {
            Write-Error "Sidecar exceeds 185 MB limit (got $([math]::Round($size,2)) MB). Phase 1c gate — torch must be removed from the bundle before this passes."
            exit 1
          }
          Write-Host "Sidecar size within 185 MB limit (size gate passed)."

      # plan-runtime-pack-split.md §11.3 — Torch-free check (HARD-FAIL when
      - name: Verify sidecar is torch-free (Phase 1c gate, plan §11.3)
        if: ${{ hashFiles('scripts/build/check_bundle_torch_free.sh') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          BIN="src-tauri/bin/python-sidecar-${{ matrix.target }}.exe"
          test -f "$BIN" || { echo "ERROR: sidecar binary missing at $BIN"; exit 1; }
          bash scripts/build/check_bundle_torch_free.sh "$BIN"

      - name: Upload sidecar binary (intermediate)
        uses: actions/upload-artifact@v6
        with:
          # TX-40: arch-suffix this name when enabling the aarch64 leg.
          name: windows-sidecar-exe
          path: src-tauri/bin/python-sidecar-${{ matrix.target }}.exe
          if-no-files-found: error

  build-worker-exe:
    # JOB SPLIT (2026-09-29): the worker Nuitka freeze gets its own job so
    # it holds a full 240min budget in parallel with the sidecar freeze
    # (plan-runtime-pack-split.md §4.4 / §11.5). The tauri-windows-build job
    # downloads its binary via artifacts. Matrix mirrors tauri-windows-build;
    # keep all job matrices in lockstep (C-CI-4, TX-40).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-2022
            tauri_config: tauri.windows-x86_64.conf.json
          # - arch: aarch64
          #   target: aarch64-pc-windows-msvc
          #   runner: windows-11-arm
          #   tauri_config: tauri.windows-aarch64.conf.json
    # No job-level if: — matrix.* is illegal in jobs.<id>.if (C-CI-4 / TX-40).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      # TX-40: target triple from matrix (x86_64 or aarch64 template); job-level env.
      PYBS_TRIPLE: ${{ matrix.target }}
      # NUITKA_CACHE_DIR pins Nuitka's cache base (clcache object files +
      # dependency-walker downloads) so the cache step below has a stable path
      # to persist. MUST be job-level: C-CI-12's lesson is that step-level env
      # does NOT reach the Nuitka/SCons C-compiler subprocess, so a step-level
      # value would silently leave Nuitka on its appdirs default and the cached
      # directory would stay empty.
      NUITKA_CACHE_DIR: C:\Users\runner\AppData\Local\nuitka
      # Caching is INTENTIONALLY on in this job (no CLCACHE_DISABLE):
      # Nuitka wraps cl with its inline clcache copy and stores objects
      # under its own cache dir, which the ccache step above persists
      # across runs, so repeat builds skip unchanged TUs. The old torch
      # C-compile hang that motivated the disable is gone with torch
      # nofollowed out of every freeze (NU-106 / C-CI-8).

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Nuitka clcache: persist MSVC object files between builds. This is the
      # step that makes a repeat freeze minutes instead of ~3 h. The previous
      # `nuitka\cache` path matched no real Nuitka directory, so this step
      # reported "Cache Not Found" on every run and NO cache was ever written
      # (verified: zero `tauri-windows-nuitka-*` entries existed on the repo).
      # The key is per-``matrix.target`` because both freeze jobs run in
      # parallel; sharing one key made them race to write the same entry.
      - name: Cache Nuitka build artifacts (clcache objects)
        uses: actions/cache@v5
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: tauri-windows-nuitka-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('pyproject.toml', 'requirements-lock.txt') }}
          restore-keys: |
            tauri-windows-nuitka-${{ runner.os }}-${{ matrix.target }}-

      # Scons build dir: when it survives between runs, scons skips
      # up-to-date objects (checksum-based) instead of recompiling ~800
      # TUs from scratch. Keyed on deps so a dependency bump rebuilds.
      - name: Cache Nuitka scons build dir (incremental C builds)
        uses: actions/cache@v5
        with:
          path: src-tauri/bin/*.build
          key: tauri-windows-scons-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('pyproject.toml', 'requirements-lock.txt') }}
          restore-keys: |
            tauri-windows-scons-${{ runner.os }}-${{ matrix.target }}-

      - name: Download + verify python-build-standalone
        shell: pwsh
        run: |
          $date = $env:PYBS_DATE
          $pyver = $env:PYBS_VERSION
          $triple = $env:PYBS_TRIPLE
          $archive = "cpython-$pyver+$date-$triple-install_only.tar.gz"
          $url = "https://github.com/astral-sh/python-build-standalone/releases/download/$date/$archive"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $archive
          # The python-build-standalone releases do NOT have a SHA256SUMS.txt aggregate.
          $shaUrl = "https://github.com/astral-sh/python-build-standalone/releases/download/$date/$archive.sha256"
          Write-Host "Downloading checksum: $shaUrl"
          Invoke-WebRequest -Uri $shaUrl -OutFile "$archive.sha256"
          # The .sha256 file contains: "<sha256>  <filename>"
          $expected = (Get-Content "$archive.sha256" -Raw).Split(' ', 2)[0].Trim().ToLower()
          $actual = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLower()
          if ($expected -ne $actual) {
            Write-Error "SHA-256 mismatch for $archive`nexpected=$expected`nactual=$actual"
            exit 1
          }
          Write-Host "SHA-256 OK: $actual"
          # Extract to C:\tools\pybs\python (matches runbook §0.7)
          New-Item -ItemType Directory -Force -Path C:\tools\pybs | Out-Null
          tar -xzf $archive -C C:\tools\pybs
          Write-Host "PYBS python:"
          C:\tools\pybs\python\python.exe --version
          # Add PYBS to GITHUB_ENV so subsequent steps can use it.
          echo "PYBS=C:\tools\pybs\python\python.exe" >> $env:GITHUB_ENV
          # Install the project + Nuitka into the PYBS env (the env that
          C:\tools\pybs\python\python.exe -m pip install --upgrade --no-warn-script-location pip
          C:\tools\pybs\python\python.exe -m pip install --no-warn-script-location nuitka==2.8.10 zstandard ordered-set
          C:\tools\pybs\python\python.exe -m pip install --no-warn-script-location -e ".[dev,test]"
          C:\tools\pybs\python\python.exe -c "import faster_whisper, ctranslate2; print('ctranslate2', ctranslate2.__version__)"

      # plan-runtime-pack-split.md §4.4 / §11.5 — Worker exe build.
      # FV-58: PYBS extracts to C:\tools\pybs\python\python.exe; the script
      # expects VOICE_TYPER_PYBS_DIR to be that tree's PARENT (C:\tools\pybs)
      # so $DIR/python/python.exe resolves. Workspace-relative .python-build-standalone
      # never existed on this runner and silently fell back to PATH python.
      - name: Build the worker binary with Nuitka (plan §4.4)
        if: ${{ hashFiles('scripts/build/build_worker_windows.sh') != '' }}
        shell: bash
        env:
          VOICE_TYPER_PYBS_DIR: C:\tools\pybs
        run: |
          set -euo pipefail
          bash scripts/build/build_worker_windows.sh
          test -f "src-tauri/bin/lausu-worker-${{ matrix.target }}.exe" \
            || { echo "ERROR: worker binary not built"; exit 1; }
          ls -lh "src-tauri/bin/lausu-worker-${{ matrix.target }}.exe"

      # plan-runtime-pack-split.md §11.4 — Runtime pack size gate. The pack
      - name: Assert runtime pack (worker onefile) size <= 200 MB (plan §11.4, Phase 2c target)
        if: ${{ hashFiles('scripts/build/build_worker_windows.sh') != '' }}
        shell: pwsh
        run: |
          $worker = "src-tauri\bin\lausu-worker-${{ matrix.target }}.exe"
          if (-not (Test-Path $worker)) {
            Write-Host "Worker binary not present — skipping pack size gate."
            exit 0
          }
          $size = (Get-Item $worker).Length / 1MB
          Write-Host "Runtime pack (worker onefile) size: $([math]::Round($size,2)) MB (limit: 200 MB)"
          if ($size -gt 200) {
            Write-Error "Runtime pack exceeds 200 MB limit (got $([math]::Round($size,2)) MB). Phase 2c gate — review the worker's bundled ML deps."
            exit 1
          }
          Write-Host "Runtime pack size within 200 MB limit (size gate passed)."

      - name: Upload worker binary (intermediate)
        uses: actions/upload-artifact@v6
        with:
          # TX-40: arch-suffix this name when enabling the aarch64 leg.
          name: windows-worker-exe
          path: src-tauri/bin/lausu-worker-${{ matrix.target }}.exe
          if-no-files-found: error

  tauri-windows-build:
    # JOB SPLIT (2026-09-29): this job no longer freezes anything itself.
    # It downloads the sidecar + worker binaries from the build-sidecar-exe
    # / build-worker-exe jobs (which hold their own 240min budgets in
    # parallel) and runs native build + gates + Tauri packaging + signing.
    # MIG-1.5: enabled for manual workflow_dispatch triggers.
    needs: [build-sidecar-exe, build-worker-exe]
    # MIG-1.5 / TX-40: active matrix is x86_64-only (windows-2022). aarch64 stays a
    # commented template (C-CI-4: no public windows-11-arm runner; matrix not in
    # jobs.<id>.if). Default binary names grepped by mig18 signing tests:
    #   python-sidecar-x86_64-pc-windows-msvc.exe
    #   python-sidecar-aarch64-pc-windows-msvc.exe  (aarch64 template, commented)
    # Artifact names (C-CI-13): tauri-windows-installer, Lausu-Tauri-MSI,
    # Lausu-Tauri-Sidecar-Binaries, Lausu-Tauri-SHA256SUMS.
    # If enabling aarch64, also add tauri.windows-aarch64.conf.json + arch-suffix
    # those artifact names (TX-40 GATE STATUS / docs/code-notes/ci-workflows.md).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-2022
            tauri_config: tauri.windows-x86_64.conf.json
          # - arch: aarch64
          #   target: aarch64-pc-windows-msvc
          #   runner: windows-11-arm
          #   tauri_config: tauri.windows-aarch64.conf.json
    # No job-level if: — matrix.* is illegal in jobs.<id>.if (C-CI-4 / TX-40).
    runs-on: ${{ matrix.runner }}
    # C-CI-3: timeout-minutes 240 — real build 90-110 min; 120 cancelled mid-build.
    # Never cut this; if a run hits 240, cut C compilation, not the timeout.
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write   # required for actions/attest-build-provenance
      attestations: write
    env:
      # TX-40: target triple from matrix (x86_64 or aarch64 template); job-level env.
      PYBS_TRIPLE: ${{ matrix.target }}
      RUST_TARGET: ${{ matrix.target }}
      # CRIT-7 / C-CI-11: secrets.* is NOT available in step if: — map to job env first.
      # (sign=true + missing secrets hard-fail; empty on forks → signing steps skip.)
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # Normalized sign flag. Required because GitHub compares a boolean input
      # differently per event (actions/runner#3571): workflow_call (tauri-build.yml
      # passes `fromJSON(...)` → a real boolean) matches TRUE, direct dispatch
      # (string 'true') matches 'true'. A single form leaves the whole TX-23/S1-CR-99
      # signing gate set inert on the other path. env context is available in step
      # if: (the secrets rule above), so gate on this string instead of inputs.sign.
      SIGN_ENABLED: ${{ inputs.sign == true || inputs.sign == 'true' }}
      # S10-CC-1 / C-CI-12: CLCACHE_DISABLE must be job-level — step-level does not
      # reach Nuitka/SCons; torch C compile hangs indefinitely without it.
      CLCACHE_DISABLE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12 (dev env)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install Rust toolchain (${{ env.RUST_TARGET }})
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ env.RUST_TARGET }}

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-windows-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-windows-${{ runner.os }}-

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          # Node 24 — CURRENT TARGET. Do NOT downgrade to Node 20 (deprecated on GitHub Actions 2025-09-19).
          # If a newer LTS is available, bump this comment AND the version below together.
          node-version: "24"
          cache: npm
          cache-dependency-path: voice_typer/client/package-lock.json

      - name: Install npm dependencies
        working-directory: voice_typer/client
        run: npm ci

      # Nuitka freezes moved to the build-sidecar-exe / build-worker-exe
      # jobs (JOB SPLIT): this job downloads their binaries below, so the
      # Nuitka ccache restore and the python-build-standalone download that
      # used to live here are gone (nothing in this job runs Nuitka).

      # do NOT downgrade below 2.8.10. numpy 2.5.x ships PEP 695
      - name: Install Python dev deps (uv)
        shell: pwsh
        run: |
          $env:UV_LINK_MODE = "copy"
          uv pip install --system ".[dev,test]"
          uv pip install --system nuitka==2.8.10 zstandard ordered-set
          pip list

      # JOB SPLIT: the Nuitka freezes (sidecar + worker) now run in the
      # build-sidecar-exe / build-worker-exe jobs; their binaries arrive
      # via artifacts below. Nothing is compiled in this job anymore.

      - name: Download sidecar binary
        uses: actions/download-artifact@v6
        with:
          name: windows-sidecar-exe
          path: src-tauri/bin

      - name: Download worker binary
        uses: actions/download-artifact@v6
        with:
          name: windows-worker-exe
          path: src-tauri/bin

      # NOTE: the standalone prewarm binary was REMOVED per

      - name: Build the native windows-key-listener (ADR-0020 §6.4)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build\compile_native.ps1
          if (-not (Test-Path "src-tauri\resources\native\windows-key-listener.exe")) {
            Write-Error "Native listener binary not built"; exit 1
          }

      # TX-23: honor the `sign` workflow_call input instead of gating
      # fail (a misconfigured release must not silently ship unsigned);
      - name: Fail fast — sign=true but signing secrets missing
        if: ${{ env.SIGN_ENABLED == 'true' && (env.WIN_CSC_LINK == '' || env.WIN_CSC_KEY_PASSWORD == '') }}
        shell: pwsh
        run: |
          Write-Error "sign=true was requested but WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD are missing. Add the secrets to the repository, or dispatch with sign=false."
          exit 1

      # S1-CR-99: sign sidecar + native listener. Pre-fix the loop
      # was bundled into the NSIS installer UNSIGNED. SmartScreen on Windows 11
      # SmartScreen reputation note: a freshly-issued OV certificate starts
      # with "unknown publisher" in SmartScreen and builds reputation over
      # a stable OV/EV cert, consistent signing, and the SmartScreen
      # migration path (Azure Trusted Signing) is tracked in the security
      - name: Sign sidecar + native listener (optional — ADR-0020 §13.1)
        if: ${{ env.SIGN_ENABLED == 'true' && env.WIN_CSC_LINK != '' && env.WIN_CSC_KEY_PASSWORD != '' }}
        shell: pwsh
        run: |
          # Write the PFX (base64-encoded in the secret) to a temp file
          # and sign every binary with signtool + an RFC-3161 timestamp.
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:WIN_CSC_LINK))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Using signtool: $signtool"
          # C-BRAND-1: derive the Authenticode description from the branding
          $sigDescMatch = Select-String -Path voice_typer/server/branding.py -Pattern '^APP_NAME\s*=\s*"([^"]+)"' -ErrorAction SilentlyContinue
          if (-not $sigDescMatch) { Write-Error "branding.py APP_NAME not found in workspace"; exit 1 }
          $sigDescription = $sigDescMatch.Matches[0].Groups[1].Value
          # TX-40: signing targets use matrix.target so the aarch64 leg
          foreach ($exe in @(
                "src-tauri\bin\python-sidecar-${{ matrix.target }}.exe",
                "src-tauri\resources\native\windows-key-listener.exe"
          )) {
            if (-not (Test-Path $exe)) {
              Write-Error "Cannot sign missing binary: $exe"; exit 1
            }
            & $signtool sign /f $pfxPath /p $env:WIN_CSC_KEY_PASSWORD `
                /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "$sigDescription" /du "https://Lausu.app" $exe
            if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed for $exe"; exit 1 }
            & $signtool verify /pa /v $exe
          }
          # C-CI-11 / plan §11.5: worker exe is a 5th Authenticode binary
          # (same S1-CR-99 SmartScreen rationale; conditional until Phase 2a).
          $workerExe = "src-tauri\bin\lausu-worker-${{ matrix.target }}.exe"
          if (Test-Path $workerExe) {
            Write-Host "Signing worker exe (5th binary): $workerExe"
            & $signtool sign /f $pfxPath /p $env:WIN_CSC_KEY_PASSWORD `
                /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "$sigDescription" /du "https://Lausu.app" $workerExe
            if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed for $workerExe"; exit 1 }
            & $signtool verify /pa /v $workerExe
          } else {
            Write-Host "Worker exe not present — skipping worker signing (5th binary gate; worker build is live)."
          }
          Remove-Item $pfxPath -Force

      # C-CI-7: fail-fast gates BEFORE cargo tauri build (order: versions --check →
      # drift pytest → stub generation → --check-icons). Stub gen AFTER drift pytest
      # (icons --clean deletes fresh stubs). Never remove/reorder these gates.
      - name: Verify version lockstep across layers (fail fast)
        shell: bash
        run: python scripts/build/sync_versions.py --check

      - name: Verify config drift guards (icons, identity, binaries) (fail fast)
        shell: bash
        run: |
          python -m pytest \
            tests/tauri/test_bundle_identifier_parity.py \
            tests/tauri/test_gen_tauri_icons_stub.py::test_tauri_conf_icon_list_matches_tracked_icons \
            tests/tauri/test_gen_tauri_icons_stub.py::test_per_arch_configs_do_not_override_bundle_icon \
            tests/tauri/test_config_script_drift.py \
            -q --no-cov

      # ADR-0024 Step 7 slim-core ML-import ratchet: the slim core must not
      # GROW its faster_whisper / ctranslate2 import footprint (they are the
      # worker's, not the slim core's). onnxruntime is intentionally NOT
      # counted — VAD + the GTCRN filter stay in the slim core on the real-time
      # audio path (ADR-0024 Step-7 ownership decision, plan §5.3). Pure
      # source-level check; runs AFTER the drift pytest and BEFORE stub gen so
      # C-CI-7's ordering (drift -> [this] -> stub-gen -> --check-icons) holds.
      - name: Assert slim-core ML-import ratchet (Step 7 fail-fast gate)
        shell: bash
        run: python scripts/slim_core_ml_ratchet_check.py

      # C-CI-7: generate placeholder BINARY stubs (icons are real committed files).
      - name: Generate Tauri binary stubs
        shell: bash
        run: |
          python scripts/gen_tauri_icons_stub.py --check || python scripts/gen_tauri_icons_stub.py

      # Fail-fast gate: verify EVERY committed file in tauri.conf.json
      - name: Verify bundle.icon icons are present + valid (fail fast)
        shell: bash
        run: python scripts/gen_tauri_icons_stub.py --check-icons

      # TK-48: run the Windows-gated #[cfg(target_os = "windows")] Rust
      - name: cargo test (Tauri Rust host unit tests — Windows-gated branches)
        shell: pwsh
        working-directory: src-tauri
        run: |
          # lausu-tauri is a binary-only crate — `--bin` runs the
          # unit tests without paying for integration-test crates.
          cargo test --target ${{ env.RUST_TARGET }} --bin lausu-tauri

      # WR-17: pin tauri-cli to ^2.0 (major lockstep with Tauri v2).
      - name: Install tauri-cli (v2)
        shell: pwsh
        run: cargo install tauri-cli --version "^2.0"

      - name: Build the Tauri app (ADR-0020 §7)
        shell: pwsh
        run: |
          cd src-tauri
          # XS-28 / C-CI-10: apply per-arch tauri config (--target + --config required).
          cargo tauri build --target ${{ matrix.target }} --config ${{ matrix.tauri_config }}

      - name: Locate + verify installer artifacts
        id: artifacts
        shell: pwsh
        run: |
          # (mirrors the resource probe below, TX-40).
          $bundleRoots = @(
            "src-tauri\target\${{ matrix.target }}\release\bundle",
            "src-tauri\target\release\bundle"
          )
          $nsis = $null
          $msi = $null
          foreach ($root in $bundleRoots) {
            if (-not $nsis) {
              $nsis = Get-ChildItem "$root\nsis\*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            }
            if (-not $msi) {
              $msi = Get-ChildItem "$root\msi\*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
            }
          }
          $standalone = $null
          foreach ($root in @("src-tauri\target\${{ matrix.target }}\release", "src-tauri\target\release")) {
            $candidate = Join-Path $root "lausu-tauri.exe"
            if (Test-Path -LiteralPath $candidate) {
              $standalone = $candidate
              break
            }
          }
          if (-not $nsis) {
            Write-Error "NSIS installer not found under: $($bundleRoots -join '; ')"
            exit 1
          }
          Write-Host "NSIS: $($nsis.FullName)"
          Write-Host "MSI: $($msi.FullName)"
          Write-Host "Standalone: $standalone"
          echo "nsis_path=$($nsis.FullName)" >> $env:GITHUB_OUTPUT
          echo "msi_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT

      - name: Post-build assertion — bundle has no non-Windows binaries
        # NSIS installer would bundle ~5 unnecessary prewarm binaries +
        shell: pwsh
        run: |
          # TX-40: per-target resource dir uses matrix.target (cargo tauri
          $resourceDirs = @(
            "src-tauri\target\${{ matrix.target }}\release\resources",
            "src-tauri\target\release\resources"
          )
          # Forbidden substrings — any resource whose name contains one of
          # these is a non-Windows binary that should not be in the bundle.
          $forbidden = @(
            "prewarm-aarch64-apple-darwin",
            "prewarm-x86_64-apple-darwin",
            "prewarm-x86_64-unknown-linux-gnu",
            "prewarm-aarch64-unknown-linux-gnu",
            "macos-key-listener",
            "linux-key-listener"
          )
          $violations = @()
          foreach ($dir in $resourceDirs) {
            if (-not (Test-Path $dir)) { continue }
            foreach ($file in Get-ChildItem $dir -File -ErrorAction SilentlyContinue) {
              foreach ($bad in $forbidden) {
                if ($file.Name -like "*$bad*") {
                  $violations += "$($file.FullName) (matches forbidden pattern '$bad')"
                }
              }
            }
          }
          if ($violations.Count -gt 0) {
            Write-Error "Windows bundle contains non-Windows binaries:"
            $violations | ForEach-Object { Write-Host "  - $_" }
            Write-Error "Check tauri.windows-x86_64.conf.json bundle.resources list."
            exit 1
          }
          Write-Host "Bundle contains only Windows binaries (assertion passed)"

      # (Phase 2c target, ≤45 MB). The slim core is the NSIS installer
      # pack is a separate download per §4.1/§11.6). Today the NSIS
      - name: Assert slim-core installer size <= 45 MB (plan §11.4, Phase 2c target — informational)
        shell: pwsh
        continue-on-error: true
        run: |
          $nsis = "${{ steps.artifacts.outputs.nsis_path }}"
          if (-not (Test-Path $nsis)) {
            Write-Host "NSIS installer not found at $nsis — skipping slim-core size gate."
            exit 0
          }
          $size = (Get-Item $nsis).Length / 1MB
          Write-Host "NSIS installer size: $([math]::Round($size,2)) MB (Phase 2c slim-core target: 45 MB)"
          if ($size -gt 45) {
            Write-Warning "NSIS installer exceeds 45 MB slim-core limit (got $([math]::Round($size,2)) MB). Phase 2c target — gate is informational (continue-on-error: true) until the slim-core build strips ML libs out of the NSIS payload."
            exit 1
          }
          Write-Host "Slim core size within 45 MB limit (size gate passed)."

      - name: Sign the final NSIS installer (optional — ADR-0020 §13.1)
        if: ${{ env.SIGN_ENABLED == 'true' && env.WIN_CSC_LINK != '' && env.WIN_CSC_KEY_PASSWORD != '' }}
        shell: pwsh
        run: |
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:WIN_CSC_LINK))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1 -ExpandProperty FullName
          # C-BRAND-1: derive the Authenticode description from branding.py
          # (see the Sign sidecar step for the full rationale).
          $sigDescMatch = Select-String -Path voice_typer/server/branding.py -Pattern '^APP_NAME\s*=\s*"([^"]+)"' -ErrorAction SilentlyContinue
          if (-not $sigDescMatch) { Write-Error "branding.py APP_NAME not found in workspace"; exit 1 }
          $sigDescription = $sigDescMatch.Matches[0].Groups[1].Value
          & $signtool sign /f $pfxPath /p $env:WIN_CSC_KEY_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "$sigDescription" /du "https://Lausu.app" `
              "${{ steps.artifacts.outputs.nsis_path }}"
          & $signtool verify /pa /v "${{ steps.artifacts.outputs.nsis_path }}"
          Remove-Item $pfxPath -Force

      # S1-CR-99 / C-CI-11: MSI must be signed too — unsigned MSI inside a signed
      # NSIS installer trips SmartScreen (Intune deploy hit this). Tauri does NOT
      # sign the MSI via bundle.windows.signCommand; sign it here when present.
      - name: Sign the final MSI installer (optional — ADR-0020 §13.1)
        if: ${{ env.SIGN_ENABLED == 'true' && env.WIN_CSC_LINK != '' && env.WIN_CSC_KEY_PASSWORD != '' && steps.artifacts.outputs.msi_path != '' }}
        shell: pwsh
        run: |
          $msi = "${{ steps.artifacts.outputs.msi_path }}"
          if (-not (Test-Path $msi)) {
            Write-Host "MSI not produced by cargo tauri build — skipping MSI signing."
            exit 0
          }
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:WIN_CSC_LINK))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1 -ExpandProperty FullName
          # C-BRAND-1: derive the Authenticode description from branding.py
          # (see the Sign sidecar step for the full rationale).
          $sigDescMatch = Select-String -Path voice_typer/server/branding.py -Pattern '^APP_NAME\s*=\s*"([^"]+)"' -ErrorAction SilentlyContinue
          if (-not $sigDescMatch) { Write-Error "branding.py APP_NAME not found in workspace"; exit 1 }
          $sigDescription = $sigDescMatch.Matches[0].Groups[1].Value
          & $signtool sign /f $pfxPath /p $env:WIN_CSC_KEY_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "$sigDescription" /du "https://Lausu.app" $msi
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed for MSI: $msi"; exit 1 }
          & $signtool verify /pa /v $msi
          Remove-Item $pfxPath -Force

      # S1-CR-99: sign standalone exe too. SmartScreen reputation: OV builds
      # over time, EV immediate; migration path Azure Trusted Signing (HSM).
      # Sign every shipped PE with the same cert (C-CI-11).
      - name: Sign standalone lausu-tauri.exe (optional — ADR-0020 §13.1)
        if: ${{ env.SIGN_ENABLED == 'true' && env.WIN_CSC_LINK != '' && env.WIN_CSC_KEY_PASSWORD != '' }}
        shell: pwsh
        run: |
          $standalone = "src-tauri\target\${{ matrix.target }}\release\lausu-tauri.exe"
          if (-not (Test-Path $standalone)) {
            Write-Host "Standalone exe not found at $standalone — skipping standalone signing."
            exit 0
          }
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:WIN_CSC_LINK))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1 -ExpandProperty FullName
          # C-BRAND-1: derive the Authenticode description from branding.py
          # (see the Sign sidecar step for the full rationale).
          $sigDescMatch = Select-String -Path voice_typer/server/branding.py -Pattern '^APP_NAME\s*=\s*"([^"]+)"' -ErrorAction SilentlyContinue
          if (-not $sigDescMatch) { Write-Error "branding.py APP_NAME not found in workspace"; exit 1 }
          $sigDescription = $sigDescMatch.Matches[0].Groups[1].Value
          & $signtool sign /f $pfxPath /p $env:WIN_CSC_KEY_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "$sigDescription" /du "https://Lausu.app" $standalone
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed for standalone exe: $standalone"; exit 1 }
          & $signtool verify /pa /v $standalone
          Remove-Item $pfxPath -Force

      # must extract the ~100 MB payload + import the backend before argparse
      - name: Smoke test sidecar binary (--version)
        shell: pwsh
        run: |
          $sidecar = "src-tauri\bin\python-sidecar-${{ matrix.target }}.exe"
          if (-not (Test-Path $sidecar)) {
            Write-Error "Sidecar binary not found at $sidecar — cannot smoke test."; exit 1
          }
          Write-Host "Invoking: $sidecar --version"
          # processes launched with `&` and never sets $LASTEXITCODE for
          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = $sidecar
          $psi.Arguments = "--version"
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.CreateNoWindow = $true
          $proc = [System.Diagnostics.Process]::new()
          $proc.StartInfo = $psi
          $null = $proc.Start()
          $outTask = $proc.StandardOutput.ReadToEndAsync()
          $errTask = $proc.StandardError.ReadToEndAsync()
          # The onefile bootloader extracts the ~100 MB payload + imports
          if (-not $proc.WaitForExit(180000)) {
            try { $proc.Kill($true) } catch { }
            Write-Error "Sidecar --version did not exit within 180 s. The frozen binary is broken (hung)."; exit 1
          }
          $output = $outTask.Result
          $rc = $proc.ExitCode
          Write-Host "Output: $output"
          Write-Host "Exit code: $rc"
          if ($rc -ne 0) {
            Write-Error "Sidecar --version exited with code $rc (expected 0). The frozen binary is broken."; exit 1
          }
          if (-not ($output -match 'lausu|Lausu|voice_typer')) {
            Write-Error "Sidecar --version output did not contain the project name. Output: $output"; exit 1
          }
          Write-Host "Smoke test PASSED: sidecar --version exited 0 with project name in output."

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: tauri-windows-installer
          path: ${{ steps.artifacts.outputs.nsis_path }}
          if-no-files-found: error

      - name: Upload MSI installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: Lausu-Tauri-MSI
          path: ${{ steps.artifacts.outputs.msi_path }}
          if-no-files-found: warn

      - name: Upload sidecar + native listener
        uses: actions/upload-artifact@v6
        with:
          name: Lausu-Tauri-Sidecar-Binaries
          # TX-40: paths use matrix.target so the aarch64 leg (when enabled)
          # step (`name: Lausu-Tauri-Sidecar-Binaries`) — when the
          # and update tauri-build.yml accordingly (see TX-40 GATE STATUS
          # plan-runtime-pack-split.md §11.9 (C-CI-13): the worker exe is a
          # worker path glob matches nothing and upload-artifact@v6 silently
          path: |
            src-tauri/bin/python-sidecar-${{ matrix.target }}.exe
            src-tauri/resources/native/windows-key-listener.exe
            src-tauri/bin/lausu-worker-${{ matrix.target }}.exe
          if-no-files-found: error

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $checksums = @()
          # TX-40: checksum paths use matrix.target so both legs emit
          # plan-runtime-pack-split.md §11.9 (C-CI-13): the worker exe is
          foreach ($p in @(
                "${{ steps.artifacts.outputs.nsis_path }}",
                "${{ steps.artifacts.outputs.msi_path }}",
                "src-tauri/bin/python-sidecar-${{ matrix.target }}.exe",
                "src-tauri/resources/native/windows-key-listener.exe",
                "src-tauri/bin/lausu-worker-${{ matrix.target }}.exe",
                "src-tauri/target/${{ matrix.target }}/release/lausu-tauri.exe"
          )) {
            if (Test-Path $p) {
              $hash = (Get-FileHash -Path $p -Algorithm SHA256).Hash.ToLower()
              $name = Split-Path -Leaf $p
              $checksums += "$hash  $name"
            }
          }
          $checksums | Out-File -FilePath SHA256SUMS.txt -Encoding utf8
          Get-Content SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v6
        with:
          name: Lausu-Tauri-SHA256SUMS
          path: SHA256SUMS.txt
          if-no-files-found: error

      # launcher verifies against at login (fail-closed). TX-40: uses
      - name: Record Tauri binary SHA-256 (${{ matrix.target }})
        shell: pwsh
        run: |
          python scripts/build/update_tauri_manifests.py --triple "${{ matrix.target }}" --target-dir src-tauri\target

      # Fail-fast release gate: this leg's hash must now be present and
      # valid in the manifest. An empty/malformed value aborts the run.
      - name: Enforce Tauri manifest integrity (${{ matrix.target }})
        shell: pwsh
        run: |
          python scripts/build/update_tauri_manifests.py --check --triple "${{ matrix.target }}"

      # TX-24 / C-CI-15: tauri-binaries.json is the fail-closed integrity
      # manifest verified at login; --check aborts on empty/malformed hash.
      - name: Upload updated tauri-binaries.json
        uses: actions/upload-artifact@v6
        with:
          name: tauri-binaries-manifest-windows
          path: tauri-binaries.json
          if-no-files-found: error
          retention-days: 30

      # TX-24: gate SLSA attestation on a manual signed release build
      # ``startsWith(github.ref, 'refs/tags/v')`` gate never fired.
      - name: Attest build provenance (SLSA)
        if: ${{ github.event_name == 'workflow_dispatch' && env.SIGN_ENABLED == 'true' }}
        uses: actions/attest-build-provenance@v4
        with:
          # plan-runtime-pack-split.md §11.9 (C-CI-13): worker exe added to
          subject-path: |
            ${{ steps.artifacts.outputs.nsis_path }}
            ${{ steps.artifacts.outputs.msi_path }}
            src-tauri/target/${{ matrix.target }}/release/lausu-tauri.exe
            src-tauri/bin/lausu-worker-${{ matrix.target }}.exe
