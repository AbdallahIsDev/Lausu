# PINNED ACTION VERSIONS — DO NOT DOWNGRADE (verified 2026-07-24,
#   actions/checkout@v5 — Node 24 runtime (v4 = Node 20, deprecated)
#   analysis engine (v4 = Node 24). Keep at the latest v4 release; the
#   components must stay in lockstep (same @v4 tag).

name: "CodeQL"

on:
  push:
    branches: [main, master]
    # skip doc-only pushes — CodeQL doesn't analyze Markdown,
    # so a README typo fix should not queue a 20-min matrix build.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    - cron: '0 6 * * *'  # WR-16: daily 06:00 UTC (was weekly Mon). CodeQL
                          # suite + query packs update ~weekly upstream; a

# cancel superseded CodeQL runs on the same ref. CodeQL is
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-22.04
    # The action needs PR base/head refs; on push/schedule it errors
    # ("Both a base ref and head ref must be provided"). PR-only.
    if: github.event_name == 'pull_request'
    # Fail closed on newly-introduced advisories. pip-audit covers Python
    # (build.yml); this covers the npm + Rust dependency trees, which were
    # previously unguarded.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # The package.json `overrides` block is the accepted-findings list
          # for npm and is already reviewed there; a transitive advisory in a
          # different ecosystem must still fail.
          comment-summary-in-pr: on-failure

  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    # hard ceiling — if autobuild hangs on a broken language
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # L-35 (IMPROVE-2026-07-19): added 'actions' to scan GitHub
        # 'rust' added for the Tauri host (src-tauri), which was unscanned.
        language: ['python', 'javascript-typescript', 'actions', 'rust']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # WR-16: opt into the extended query suites. Default behavior is
          queries: security-extended, security-and-quality

      # ── S5-CR-75 (b): explicit build step for Python ─────────────────
      - name: Build Python (explicit pip install .[test])
        if: matrix.language == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Autobuild (JS/TS + Actions)
        if: matrix.language != 'python'
        uses: github/codeql-action/autobuild@v4

      # Rust has no meaningful autobuild for a Tauri host; a bare
      # `cargo check` gives CodeQL the crate graph it needs to analyze.
      - name: Setup Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@v1
        with:
          # Required input (newer v1 errors without it).
          toolchain: stable

      # The tauri build script rejects missing externalBin files, and
      # `bin/` is gitignored (real binaries are built at release).
      # Stub just the host-triple pair so `cargo check` gets past the
      # manifest gate (resources/ + icons/ are tracked, nothing to do).
      - name: Stub sidecar binaries (for cargo check)
        if: matrix.language == 'rust'
        working-directory: src-tauri
        run: |
          set -euo pipefail
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p bin
          for f in "bin/python-sidecar-${TRIPLE}" "bin/lausu-worker-${TRIPLE}"; do
            [ -f "$f" ] || { echo '#!/bin/sh' > "$f"; chmod +x "$f"; }
          done

      # The Tauri host links GTK sys crates; without headers the
      # CodeQL `cargo check` build dies on gdk-3.0. Same list as the
      # Linux smoke job; other languages skip it.
      - name: Install system deps (apt — headers only)
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config libssl-dev

      - name: Cargo check (CodeQL build)
        if: matrix.language == 'rust'
        run: cargo check
        working-directory: src-tauri

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
